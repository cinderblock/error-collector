name: Deploy

on:
  push:
    branches: [master]
    paths:
      - worker/**
      - packages/core/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      skip_migrations:
        description: Skip applying D1 migrations
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # A deploy that cannot deploy is a failure, not a notice.
      #
      # This used to be a `configured` gate that skipped the whole job when
      # D1_DATABASE_ID was unset, on the reasoning that "not set up yet" is a
      # legitimate state for a public repo. The effect was a green check mark on a
      # run that deployed nothing — the workflow reported success for doing no
      # work. That is the single failure mode this repo exists to catch in other
      # people's software, so it has no business being in its own pipeline.
      #
      # Everything required is checked here, before anything is mutated, and every
      # problem is collected so one run tells you all of them rather than making
      # you fix them one at a time. Format is checked too: an id pasted from the
      # wrong resource fails here with a clear message instead of somewhere deep
      # inside wrangler.
      - name: Require configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          problems=0

          require() {
            name="$1"; value="$2"; kind="$3"; pattern="$4"; shape="$5"
            if [ -z "$value" ]; then
              echo "::error::$kind $name is not set"
              problems=$((problems + 1))
            elif ! printf '%s' "$value" | grep -qE "$pattern"; then
              echo "::error::$kind $name does not look like $shape"
              problems=$((problems + 1))
            fi
          }

          # A Cloudflare account id and a KV namespace id are both 32 hex digits;
          # a D1 database id is a UUID. Mixing them up is the easy mistake, and
          # these patterns catch it.
          require CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID" "repository variable" \
            '^[0-9a-f]{32}$' "a Cloudflare account id (32 hex digits)"
          require KV_NAMESPACE_ID "$KV_NAMESPACE_ID" "repository variable" \
            '^[0-9a-f]{32}$' "a KV namespace id (32 hex digits)"
          require D1_DATABASE_ID "$D1_DATABASE_ID" "repository variable" \
            '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' "a D1 database id (a UUID)"
          # Required, not optional: without it the deploy cannot be verified, and an
          # unverified deploy reporting success is the same lie as the skip above.
          require DEPLOY_URL "$DEPLOY_URL" "repository variable" \
            '^https://[a-z0-9.-]+$' "an https:// origin with no trailing slash"

          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::secret CLOUDFLARE_API_TOKEN is not set"
            problems=$((problems + 1))
          fi

          if [ "$problems" -gt 0 ]; then
            echo "::error::$problems configuration problem(s); see https://github.com/cinderblock/telemetry-collector#deployment"
            exit 1
          fi
          echo "configuration present and well-formed"

      # "Wrong" includes a token that is expired, revoked, or scoped to the wrong
      # account. Checking it here means that failure arrives before migrations run,
      # rather than half way through changing the database.
      - name: Verify the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          body=$(curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if ! printf '%s' "$body" | grep -q '"success":true'; then
            echo "::error::CLOUDFLARE_API_TOKEN was rejected by Cloudflare"
            printf '%s\n' "$body"
            exit 1
          fi
          echo "token accepted"

      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      # Deploying something that does not typecheck or pass its tests is how a
      # crash collector ends up being the thing that is down.
      - name: Check
        run: bun run typecheck && bun test

      # wrangler.toml carries `local` placeholders so `wrangler dev` works with no
      # setup. The real resource ids are repo *variables*, not secrets — a D1
      # database id or KV namespace id identifies a resource, it does not grant
      # access to one — and are substituted here so the committed file never has to
      # carry environment-specific values.
      - name: Point bindings at the production resources
        working-directory: worker
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          sed -i "s|^database_id = \"local\"|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          sed -i "s|^id = \"local\"|id = \"$KV_NAMESPACE_ID\"|" wrangler.toml

          # A placeholder that survived means the substitution silently missed, and
          # deploying that would point production at a binding named "local".
          if grep -qE '^(database_id|id) = "local"$' wrangler.toml; then
            echo "::error::a binding id is still \"local\" after substitution"
            grep -nE '^(database_id|id) =' wrangler.toml
            exit 1
          fi
          grep -E '^(database_id|id) =' wrangler.toml

      - name: Apply D1 migrations
        if: inputs.skip_migrations != true
        working-directory: worker
        run: bunx wrangler d1 migrations apply TELEMETRY_DB --remote --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        working-directory: worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      # Not conditional, and not advisory. Until this passes, the only thing the
      # run has proven is that wrangler exited zero — which it also does when the
      # worker it uploaded throws on every request.
      - name: Smoke test
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$DEPLOY_URL/healthz" | grep -q ok; then
              echo "healthy"; exit 0
            fi
            echo "not healthy yet (attempt $attempt)"; sleep 5
          done
          echo "::error::deployment did not become healthy at $DEPLOY_URL/healthz"
          exit 1
